name: CI/CD Health Checker

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 07:00 UTC
  workflow_dispatch:  # Manually trigger the workflow

jobs:
  run-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Pulls your code from the repository

      - name: Set up Python
        uses: actions/setup-python@v4  # Sets up Python environment
        with:
          python-version: '3.9'  # Use Python 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Upgrade pip
          pip install -r requirements.txt  # Install dependencies from requirements.txt

      - name: Run Health Checker
        env:
          MY_GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}  # GitHub token from GitHub Secrets
          EMAIL_USER: ${{ secrets.EMAIL_USER }}  # Email sender username
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}  # Email sender password or app password
          EMAIL_TO: ${{ secrets.EMAIL_TO }}  # Recipient email address
        run: python healthCheck.py  # Run the Python health check script
